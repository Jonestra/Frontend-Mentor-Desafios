<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./src/styles.css">
  <title>Componente de Tarjeta de Vista Previa del Producto</title>
</head>
<body>
  <main class="content">
    <figure>
      <img class="img-product" src="./assets/images/image-product-mobile.jpg" alt="perfume product"/>
    </figure>
    
    <section class="info">
      <p class="description">PERFUME</p>  
      <h1 class="title">Gabrielle Essence Eau De Parfum</h1>
      <p class="product-description">A floral, solar and voluptuous interpretation composed by Olivier Polge, 
      Perfumer-Creator for the House of CHANEL.
      </p>
      <div class="price">  
        <p class="new-price">$149.99</p>
        <p class="remove-price">$169.99</p>
      </div>
      <button class="select-option" type="button">
        <img class="icon-cart" src="./assets/images/icon-cart.svg" alt="icon complement"/>
        Add to Cart
      </button>  
    </section>
  </main>
</body>
</html>
